map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 1g;

    location = / {
        return 302 /ctf/;
    }

    # Must be placed before the generic /ctf/ proxy.
    location ^~ /ctf/api/arena/ {
        proxy_pass http://arena-api:8090/api/arena/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ctf;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ^~ /assets/ {
        proxy_pass http://gzctf:8080/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.webp {
        proxy_pass http://gzctf:8080/favicon.webp;
        proxy_set_header Host $host;
    }

    # Revalidate hashed chunks on upgrades to avoid mixing old browser cache
    # with a newly rebuilt entry bundle.
    location ^~ /ctf/static/ {
        proxy_pass http://gzctf:8080/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /ctf/ {
        proxy_pass http://gzctf:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ctf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
